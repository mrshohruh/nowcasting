# Series catalogue (Phase 0, task 0.9). One entry per input series.
#
# Fields
#   id            short name used everywhere in the code
#   name          what it is
#   publisher     Uzstat | Central Bank of Uzbekistan | World Bank   (official primary publishers only)
#   source        adapter: siat | cbu_sdmx | cbu_xlsx | cbu_rate_json | worldbank_xlsx | stat_nag_xlsx
#   url           where the file is downloaded from (checked from a GitHub runner on 16 Oct 2026)
#   key           what to pick inside the file: SIAT item label, SDMX INDICATOR code, column or row label
#   codes         (siat, stat_nag_xlsx) what the adapter selects: SIAT classifier codes, or NAG item ids;
#                 ["*"] = every row. SIAT rows are selected by code, never by label; key is only checked.
#   frequency     M | Q
#   unit          as published
#   form          cumulative_ytd   values add up from January (or Q1) and restart each year
#                 discrete         one value per period
#                 level            stock or average for the period (M2, reserves, rates, prices)
#                 index_mm         % of previous month (100 = no change)
#                 growth_yoy_cum   % of the same period last year, cumulative from January
#                 growth_yoy       % of the same month/quarter last year
#   prices        nominal | real | price | none
#   block         real | services | external | prices_finance | firms | quarterly | target
#   first_period  first period available in the source
#   last_period   (optional) last period ever published, for a discontinued series; no lag check
#   months_after  backtest rule: a period is used from the 1st of the month this many months after
#                 the period ends (2 = August data from 1 October)
#   status        core (enters the models) | candidate (tested in Phase 3) | reference (checks only)
#   notes         anything the transformations must know

series:

    frequency: M
    unit: "% of same period last year"
    form: growth_yoy_cum
    prices: real
    block: real
    first_period: 2019-01
    months_after: 2
    status: core
    notes: Uzstat's own real growth; replaces deflating nominal output. Same table has 28 sub-sectors.

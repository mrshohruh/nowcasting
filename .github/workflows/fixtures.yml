name: fixtures

# Phase 1, task 1.10: save real files from hosts the Claude workspace cannot reach (World Bank)
# as offline test fixtures, and commit them back to the branch. Runs on a push that changes this
# file or the script, or by hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fixtures.yml
      - tools/capture_fixtures.py

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - run: python tools/capture_fixtures.py tests/fixtures | tee docs/fixture_capture.txt
      - name: Commit the fixtures back to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/worldbank docs/fixture_capture.txt
          git commit -m "Fixtures captured on a GitHub runner [skip ci]" || echo "no change"
          git push

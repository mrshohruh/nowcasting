name: monthly

# Phase 1, task 1.8. Downloads every catalogue series, stores the run as a dated vintage on the
# `data` branch, checks it, rebuilds the model-ready panels (store/panels/, Phase 2), and sends
# alerts. What to do when something fails:
# docs/runbook_ingest.md.
#
# - 1st of the month, 06:00 Tashkent (01:00 UTC): full run.
# - 2nd of the month, 06:00 Tashkent: catch-up, retries only the series that failed on the 1st.
# - Manual run any time: Actions tab > monthly > Run workflow. Same pipeline as the scheduled run.
on:
  schedule:
    - cron: "0 1 1 * *"
    - cron: "0 1 2 * *"
  workflow_dispatch:
    inputs:
      series:
        description: "Only these series (comma-separated ids). Leave empty for every series."
        required: false
        default: ""
      catch_up:
        description: "Catch-up: retry only the series that failed in this month's last run"
        type: boolean
        default: false
      accept:
        description: "Accept failed checks for these series (after confirming the change is real)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: monthly-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      skipped: ${{ steps.run.outputs.skipped }}
      run_id: ${{ steps.run.outputs.run_id }}
    env:
      DATA_BRANCH: data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -c constraints.txt -e .

      - name: Check out the data branch into store/
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git worktree add -B "$DATA_BRANCH" store FETCH_HEAD
          else
            echo "Branch $DATA_BRANCH does not exist yet: starting it (the run seeds the history)."
            git worktree add --detach store
            git -C store checkout -q --orphan "$DATA_BRANCH"
            git -C store rm -rf -q .
          fi

      - name: Download, check and store
        id: run
        env:
          CATCH_UP: ${{ github.event.schedule == '0 1 2 * *' || inputs.catch_up }}
          SERIES: ${{ inputs.series }}
          ACCEPT: ${{ inputs.accept }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
        run: |
          args=(--store store --trigger "$TRIGGER")
          if [ "$CATCH_UP" = "true" ]; then args+=(--catch-up); fi
          if [ -n "$SERIES" ]; then args+=(--series "$SERIES"); fi
          if [ -n "$ACCEPT" ]; then args+=(--accept "$ACCEPT"); fi
          python -m nowcast.ingest.run "${args[@]}"

      - name: Build the panels (Phase 2)
        id: panels
        if: steps.run.outcome == 'success' && steps.run.outputs.skipped != 'true'
        continue-on-error: true
        run: python -m nowcast.transform.panels --store store --out store/panels

      - name: Commit the vintage to the data branch
        if: steps.run.outcome == 'success' && steps.run.outputs.skipped != 'true'
        run: |
          cd store
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Vintage ${{ steps.run.outputs.run_id }} (${{ github.event_name }})"
          git push origin "HEAD:$DATA_BRANCH"

      - name: Alerts (Telegram, GitHub issues)
        if: always() && steps.run.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m nowcast.ingest.alerts --store store --run-id "${{ steps.run.outputs.run_id }}"

      - name: Alert that the panels could not be built
        if: always() && steps.panels.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Panels not built in run ${{ steps.run.outputs.run_id }}" \
            --body "The vintage was stored, but \`python -m nowcast.transform.panels\` failed. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Alert that the run crashed
        if: failure() && steps.run.outcome != 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m nowcast.ingest.alerts --store store --crashed

  # ── Phase 5: Nowcasting pipeline and dashboard deployment ─────────────────
  nowcast:
    needs: ingest
    if: needs.ingest.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATA_BRANCH: data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -c constraints.txt -e ".[report]"

      - name: Check out the data branch into store/
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --depth=1 origin "$DATA_BRANCH"
          git worktree add -B "$DATA_BRANCH" store FETCH_HEAD

      - name: Backtest (Models page and uncertainty bands)
        # run_backtest.py exits 1 when the Phase 3 exit check fails (headline RMSE > 0.80 x AR(1)).
        # That is a quality flag, not a pipeline failure: the scores are still written and published.
        continue-on-error: true
        run: python scripts/run_backtest.py --store store --out store/state

      - name: Run nowcasting pipeline (current quarter)
        id: produce
        run: python scripts/produce.py --store store --state-dir store/state --out _site -v

      - name: Commit state to data branch
        run: |
          cd store
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -q -m "Run state $(date +%Y-%m-%d)"
          git push origin "HEAD:$DATA_BRANCH"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Upload PDF notes
        uses: actions/upload-artifact@v4
        with:
          name: pdf-notes
          path: _site/*/pdf/

  deploy-staging:
    needs: nowcast
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (staging)
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (production)
        id: deployment
        uses: actions/deploy-pages@v4

[project]
name = "nowcast-uz"
version = "0.1.0"
description = "Monthly nowcasts of Uzbekistan's real GDP growth with explained revisions"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "requests>=2.32",
    "lxml>=5.2",
    "pyarrow>=16.0",
    "duckdb>=1.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "jinja2>=3.1",
    "plotly>=5.18",
]

[project.optional-dependencies]
report = [
    "matplotlib>=3.8",
    "nbformat>=5.9",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "plotly>=5.18",
    "weasyprint>=62.0",
    "kaleido>=0.2.1",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nowcast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that download from live sources (deselect with -m 'not network')"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Translation strings and embedded HTML/CSS templates: wrapping them hurts more than it helps
"nowcast/report/site.py" = ["E501"]
"nowcast/report/pdf.py" = ["E501"]
